<html lang="zh-Hant">
<head>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="沖繩代購">

    <title>沖繩實戰打卡清單 (雲端同步終極版)</title>
    <style>
        :root {
            --primary-color: #2c3e50; --accent-color: #3498db; --text-color: #333;
            --bg-color: #f4f7f6; --card-bg: #ffffff; --hunter-color: #27ae60;
            --route-color: #f39c12; --memo-color: #d35400; --border-color: #eee; --input-bg: #fff;
        }
        body.dark-mode {
            --primary-color: #90caf9; --accent-color: #64b5f6; --text-color: #e0e0e0;
            --bg-color: #121212; --card-bg: #1e1e1e; --hunter-color: #81c784;
            --memo-color: #ffb74d; --border-color: #444; --input-bg: #333;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px 10px 80px 10px; color: var(--text-color); transition: 0.3s; }
        
        /* 頂部與同步狀態列 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 10px auto; }
        .top-bar h1 { margin: 0; color: var(--primary-color); font-size: 1.4rem; }
        .top-actions { display: flex; gap: 10px; }
        .icon-btn { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; color: var(--text-color); transition: 0.2s;}
        
        #sync-status { text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 15px; font-weight: bold; }
        .status-syncing { color: var(--route-color) !important; }
        .status-ok { color: var(--hunter-color) !important; }

        .container { max-width: 600px; margin: 0 auto; }
        .category-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .category-title { color: var(--primary-color); border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-top: 0; font-size: 1.1rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
        .toggle-icon { font-size: 0.8rem; opacity: 0.6; }
        .category-content.hidden { display: none; }

        /* 項目樣式 */
        .location-item { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; padding-bottom: 12px; border-bottom: 1px dashed var(--border-color); }
        .location-item.dragging { opacity: 0.4; background-color: rgba(0,0,0,0.05); }
        .location-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
        .drag-handle { cursor: grab; padding-right: 12px; font-size: 1.2rem; color: #aaa; user-select: none; touch-action: none; }
        .left-content { display: flex; align-items: center; flex: 1; }
        .checkbox-container { margin-right: 10px; display: flex; align-items: center; }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: var(--accent-color); }
        .content-container { flex: 1; cursor: pointer; }
        .location-name { font-weight: bold; font-size: 0.95rem; color: var(--primary-color); line-height: 1.4;}
        .tag { background: var(--border-color); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; color: var(--text-color); margin-left: 5px; white-space: nowrap; }
        .location-desc { font-size: 0.8rem; color: var(--memo-color); margin-top: 4px; font-weight: 500; }
        .location-desc.empty { color: #888; font-weight: normal; }
        
        .btn-group { display: flex; gap: 5px; align-items: center; }
        .nav-link { background-color: #4285F4; color: white; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; white-space: nowrap;}
        .view-btn { background-color: #95a5a6; color: white; border: none; padding: 6px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; white-space: nowrap;}
        .edit-btn { background: none; border: none; font-size: 1rem; cursor: pointer; padding: 0 2px; }
        .delete-btn { background: none; border: none; color: #e74c3c; font-size: 1.2rem; cursor: pointer; padding: 0 5px; }
        
        .custom-input-group { display: flex; gap: 8px; margin-top: 10px; }
        .custom-input { flex: 1; padding: 10px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); border-radius: 6px; font-size: 0.95rem; }
        .add-btn { color: white; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; white-space: nowrap;}
        .btn-hunter { background-color: var(--hunter-color); }
        .btn-shopping { background-color: var(--accent-color); }

        .route-btn { display: block; width: 100%; background-color: var(--route-color); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(243, 156, 18, 0.3); }

        .checked .location-name { color: #888; text-decoration: line-through; }
        .checked .location-desc { color: #888; }
        
        .map-container { width: 100%; height: 300px; border-radius: 12px; overflow: hidden; border: 2px solid var(--card-bg); margin-top: 10px; }
        iframe { width: 100%; height: 100%; border: 0; }
        
        /* 遮罩層 */
        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.8); z-index: 1000; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; font-weight: bold; color: var(--primary-color); }
        body.dark-mode #loading-overlay { background: rgba(0,0,0,0.8); }
    </style>
</head>

            { id: '711_taxfree', name: '7-11 退稅採購', tag: '注意', desc: '⚠️鮮奶茶須分開含稅結帳' },
            { id: 'pokemon', name: '寶可夢中心沖繩', tag: '必逛', desc: '來客夢 AEON 內' },
            { id: 'gacha_mori', name: 'ガチャガチャの森', tag: '扭蛋', desc: '超大型扭蛋森林' },
            { id: 'otonamo', name: 'オトナモ (Otonamo)', tag: '扭蛋', desc: '大人向高級扭蛋' },
            { id: 'surugaya', name: '駿河屋 (俊合屋)', tag: '玩具', desc: '二手模型、動漫尋寶' },
            { id: 'aeon', name: '永旺夢樂城來客夢', tag: '商場', desc: '玩具反斗城、三麗鷗' },
            { id: 'iias', name: 'iias 沖繩豐崎', tag: '商場', desc: '南部商場、水族館' },
            { id: 'parco', name: '浦添 PARCO CITY', tag: '商場', desc: 'Hobby Zone' },
            { id: 'jacks', name: '傑克牛排', tag: '美食', desc: '老字號烤里肌牛排' },
            { id: 'jojoen', name: '敘敘苑 PARCO CITY店', tag: '美食', desc: '無敵海景和牛燒肉' },
            { id: 'american', name: '美國村', tag: '景點', desc: '週六 20:00 煙火' },
            { id: 'taco_rice', name: 'Taco Rice Cafe Kijimuna', tag: '美食', desc: '歐姆蛋塔可飯' },
            { id: 'el_paso', name: 'EL PASO', tag: '美食', desc: '北谷墨西哥餐廳塔可' },
            { id: 'airport', name: '那霸機場 國內線', tag: '伴手禮', desc: '二樓甜點代購收尾' }
        ];

        let appData = { hunterStores: [], shoppingStores: [], checks: {} };

        // ---------------- 2. 雲端讀寫邏輯 ----------------
        function updateStatus(msg, isSyncing = false) {
            const el = document.getElementById('sync-status');
            el.innerText = msg;
            if(isSyncing) { el.classList.add('status-syncing'); el.classList.remove('status-ok'); }
            else { el.classList.remove('status-syncing'); el.classList.add('status-ok'); }
        }

        async function loadFromCloud() {
            if (API_URL === "YOUR_GOOGLE_SCRIPT_URL_HERE") {
                alert("⚠️ 你還沒替換 API_URL 喔！請把你的 Google Script 網址貼上。");
                document.getElementById('loading-overlay').style.display = 'none';
                return;
            }

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (Object.keys(data).length > 0 && (data.hunterStores || data.shoppingStores)) {
                    appData = data;
                    // 防呆：如果雲端竟然沒有 hunterStores，就把 111 間預設補進去
                    if (!appData.hunterStores || appData.hunterStores.length === 0) appData.hunterStores = defaultHunterStores;
                    if (!appData.shoppingStores || appData.shoppingStores.length === 0) appData.shoppingStores = defaultShoppingStores;
                } else {
                    // 第一次連上雲端，把所有的預設資料存進去
                    appData.hunterStores = defaultHunterStores;
                    appData.shoppingStores = defaultShoppingStores;
                    await saveToCloud(); 
                }
                
                if (!appData.checks) appData.checks = {};
                renderAll();
                document.getElementById('loading-overlay').style.display = 'none';
                updateStatus("🟢 已載入最新雲端資料");
            } catch (error) {
                alert("連線雲端失敗，請檢查網路狀態。");
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }

        async function saveToCloud() {
            updateStatus("🔄 正在同步至雲端...", true);
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(appData),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                updateStatus("🟢 同步完成 (所有裝置已同步)");
            } catch (error) {
                updateStatus("🔴 同步失敗，請檢查網路", false);
            }
        }

        // ---------------- 3. UI 渲染 ----------------
        function renderAll() {
            const hList = document.getElementById('hunterStoreList');
            hList.innerHTML = appData.hunterStores.map((item, index) => 
                createItemHtml('hunter_'+index, item.name, '獵人包套', item.memo, 'hunter', index)
            ).join('');

            const sList = document.getElementById('shoppingStoreList');
            sList.innerHTML = appData.shoppingStores.map((item, index) => 
                createItemHtml(item.id, item.name, item.tag, item.desc, 'shopping', index)
            ).join('');
        }

        function createItemHtml(id, name, tag, desc, listType, index) {
            const isChecked = appData.checks[id] === true;
            const checkedClass = isChecked ? 'checked' : '';
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' 沖繩')}`;
            const descStyleClass = desc ? 'location-desc' : 'location-desc empty';
            const descHtml = desc ? `<div class="${descStyleClass}">📝 ${desc}</div>` : '';
            
            return `
                <div class="location-item ${checkedClass}" data-name="${name}" 
                     draggable="true" ondragstart="dragStart(event, ${index}, '${listType}')" 
                     ondragover="dragOver(event)" ondrop="drop(event, ${index}, '${listType}')">
                    <div class="drag-handle">☰</div>
                    <div class="left-content" onclick="toggleCheck('${id}', event)">
                        <div class="checkbox-container">
                            <input type="checkbox" id="cb_${id}" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck('${id}', event)">
                        </div>
                        <div class="content-container">
                            <div class="location-name">${name}<span class="tag">${tag}</span></div>
                            ${descHtml}
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="edit-btn" onclick="editMemo('${listType}', ${index}, event)" title="編輯備註">✏️</button>
                        <button class="view-btn" onclick="previewMap('${name}', event)">預覽</button>
                        <a href="${mapUrl}" target="_blank" class="nav-link">導航</a>
                        <button class="delete-btn" onclick="deleteItem('${listType}', ${index}, event)">×</button>
                    </div>
                </div>
            `;
        }

        // ---------------- 4. 互動操作 (修改資料並呼叫 saveToCloud) ----------------
        window.toggleCheck = function(id, event) {
            if (event && (event.target.tagName === 'BUTTON' || event.target.tagName === 'A')) return;
            const cb = document.getElementById('cb_' + id);
            if (event && event.target.type !== 'checkbox') cb.checked = !cb.checked;
            appData.checks[id] = cb.checked;
            renderAll();
            saveToCloud(); // 存檔
        };

        window.editMemo = function(listType, index, event) {
            event.stopPropagation();
            let list = listType === 'hunter' ? appData.hunterStores : appData.shoppingStores;
            let currentMemo = listType === 'hunter' ? (list[index].memo || '') : (list[index].desc || '');
            let newMemo = prompt(`輸入「${list[index].name}」的備註：`, currentMemo);
            if (newMemo !== null) {
                if (listType === 'hunter') list[index].memo = newMemo.trim();
                else list[index].desc = newMemo.trim();
                renderAll();
                saveToCloud(); // 存檔
            }
        };

        window.addHunterStore = function() {
            const val = document.getElementById('hunterInput').value.trim();
            if (val) {
                appData.hunterStores.push({ name: val, memo: '' });
                document.getElementById('hunterInput').value = '';
                renderAll();
                saveToCloud(); // 存檔
            }
        };

        window.addShoppingStore = function() {
            const val = document.getElementById('shoppingInput').value.trim();
            if (val) {
                appData.shoppingStores.push({ id: 'shop_' + Date.now(), name: val, tag: '自訂', desc: '' });
                document.getElementById('shoppingInput').value = '';
                renderAll();
                saveToCloud(); // 存檔
            }
        };

        window.deleteItem = function(listType, index, event) {
            event.stopPropagation();
            let list = listType === 'hunter' ? appData.hunterStores : appData.shoppingStores;
            const id = listType === 'hunter' ? 'hunter_'+index : list[index].id;
            delete appData.checks[id]; 
            list.splice(index, 1);
            renderAll();
            saveToCloud(); // 存檔
        };

        // ---------------- 5. 拖曳與介面功能 ----------------
        let dragSrcIndex = null, dragListType = null;
        window.dragStart = function(e, index, listType) { dragSrcIndex = index; dragListType = listType; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => e.target.classList.add('dragging'), 0); };
        window.dragOver = function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
        window.drop = function(e, targetIndex, listType) {
            e.preventDefault();
            document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
            if (dragListType !== listType || dragSrcIndex === targetIndex) return; 
            let list = listType === 'hunter' ? appData.hunterStores : appData.shoppingStores;
            const movedItem = list.splice(dragSrcIndex, 1)[0];
            list.splice(targetIndex, 0, movedItem);
            renderAll();
            saveToCloud(); // 拖曳完存檔
        };
        document.addEventListener('dragend', () => document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging')));

        window.toggleCategory = function(id) {
            const content = document.getElementById('content_' + id);
            const icon = document.getElementById('icon_' + id);
            content.classList.toggle('hidden');
            icon.innerText = content.classList.contains('hidden') ? '◀' : '▼';
            localStorage.setItem('toggle_' + id, content.classList.contains('hidden') ? 'closed' : 'open');
        };

        window.previewMap = function(name, event) {
            event.stopPropagation();
            document.getElementById('content_map').classList.remove('hidden');
            document.getElementById('icon_map').innerText = '▼';
            document.getElementById('mapFrame').src = `https://maps.google.com/maps?q=${encodeURIComponent(name + ' 沖繩')}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            document.getElementById('mapSection').scrollIntoView({ behavior: 'smooth' });
        };

        window.generateRoute = function() {
            const unchecked = Array.from(document.querySelectorAll('.location-item:not(.checked)')).map(el => el.getAttribute('data-name')).filter(n => n && !n.includes('退稅')).map(n => encodeURIComponent(n + ' 沖繩'));
            if (unchecked.length === 0) return alert('太棒了！所有任務已完成！');
            if (unchecked.length > 9) { alert('未完成地點較多，為您導航前 9 個。'); unchecked.splice(9); }
            window.open(`https://www.google.com/maps/dir/${unchecked.join('/')}`, '_blank');
        };

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
        }

        // ---------------- 6. 匯出 Google地圖 CSV ----------------
        window.exportToCSV = function() {
            let csvContent = "\uFEFF"; // 解決中文亂碼
            csvContent += "地點名稱,搜尋關鍵字,分類,備註\n";
            
            appData.hunterStores.forEach(item => {
                csvContent += `"${item.name}","沖縄 ${item.name}","🎯獵人包套","${item.memo}"\n`;
            });
            
            appData.shoppingStores.forEach(item => {
                csvContent += `"${item.name}","沖縄 ${item.name}","🛍️${item.tag}","${item.desc}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "沖繩打卡地圖.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            alert("✅ 地圖檔 (CSV) 已下載！請前往「Google 我的地圖 (My Maps)」匯入。");
        };

        // ---------------- 啟動程式 ----------------
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('darkMode') === 'true') toggleDarkMode();
            ['hunter', 'shopping', 'map'].forEach(id => {
                if (localStorage.getItem('toggle_' + id) === 'closed') toggleCategory(id);
            });
            loadFromCloud(); // 讀取雲端資料
        });
        
        // PWA Icon
        const blob = new Blob([JSON.stringify({name:"沖繩打卡",display:"standalone",background_color:"#f4f7f6",theme_color:"#2c3e50",icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E📍%3C/text%3E%3C/svg%3E",sizes:"192x192",type:"image/svg+xml"}]})], { type: 'application/manifest+json' });
        document.getElementById('manifest-link').href = URL.createObjectURL(blob);
    </script>
</body>
</html>
