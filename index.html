<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA 與桌面捷徑優化 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="沖繩代購">
    <link id="manifest-link" rel="manifest" href="">
    <title>沖繩實戰打卡清單</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-color: #333;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --hunter-color: #27ae60;
            --route-color: #f39c12;
            --memo-color: #d35400;
            --border-color: #eee;
            --input-bg: #fff;
        }

        /* 🌙 深色模式變數 */
        body.dark-mode {
            --primary-color: #90caf9;
            --accent-color: #64b5f6;
            --text-color: #e0e0e0;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --hunter-color: #81c784;
            --memo-color: #ffb74d;
            --border-color: #444;
            --input-bg: #333;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px 10px 80px 10px; 
            color: var(--text-color); 
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* 頂部工具列 */
        .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 20px auto; }
        .top-bar h1 { margin: 0; color: var(--primary-color); font-size: 1.4rem; }
        .top-actions { display: flex; gap: 10px; }
        .icon-btn { 
            background: var(--card-bg); border: 1px solid var(--border-color); 
            border-radius: 50%; width: 36px; height: 36px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            color: var(--text-color); transition: 0.3s;
        }

        .container { max-width: 600px; margin: 0 auto; }
        .category-card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            transition: background-color 0.3s;
        }
        
        .category-title { 
            color: var(--primary-color); 
            border-bottom: 2px solid var(--border-color); 
            padding-bottom: 8px; 
            margin-top: 0; 
            font-size: 1.1rem;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            cursor: pointer; 
            user-select: none; 
        }
        .toggle-icon { font-size: 0.8rem; opacity: 0.6; }
        .category-content.hidden { display: none; }

        /* 拖曳與項目樣式 */
        .location-item { 
            display: flex; align-items: center; justify-content: space-between;
            margin: 12px 0; padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-color);
            transition: opacity 0.2s, background-color 0.2s;
        }
        .location-item.dragging { opacity: 0.4; background-color: rgba(0,0,0,0.05); }
        .location-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
        
        .drag-handle { 
            cursor: grab; padding-right: 12px; font-size: 1.2rem; color: #aaa;
            user-select: none; touch-action: none; 
        }
        
        .left-content { display: flex; align-items: center; flex: 1; }
        .checkbox-container { margin-right: 10px; display: flex; align-items: center; }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: var(--accent-color); }
        .content-container { flex: 1; cursor: pointer; }
        .location-name { font-weight: bold; font-size: 0.95rem; color: var(--primary-color); line-height: 1.4;}
        .tag { background: var(--border-color); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; color: var(--text-color); margin-left: 5px; white-space: nowrap; }
        
        .location-desc { font-size: 0.8rem; color: var(--memo-color); margin-top: 4px; font-weight: 500; }
        .location-desc.empty { color: #888; font-weight: normal; }
        
        .btn-group { display: flex; gap: 5px; align-items: center; }
        .nav-link { background-color: #4285F4; color: white; text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; white-space: nowrap;}
        .view-btn { background-color: #95a5a6; color: white; border: none; padding: 6px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; white-space: nowrap;}
        .edit-btn { background: none; border: none; font-size: 1rem; cursor: pointer; padding: 0 2px; }
        .delete-btn { background: none; border: none; color: #e74c3c; font-size: 1.2rem; cursor: pointer; padding: 0 5px; }
        
        .custom-input-group { display: flex; gap: 8px; margin-top: 10px; }
        .custom-input { flex: 1; padding: 10px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); border-radius: 6px; font-size: 0.95rem; }
        .add-btn { color: white; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; white-space: nowrap;}
        
        .btn-hunter { background-color: var(--hunter-color); }
        .btn-shopping { background-color: var(--accent-color); }

        .route-btn {
            display: block; width: 100%; background-color: var(--route-color); color: white;
            border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1rem;
            cursor: pointer; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(243, 156, 18, 0.3);
        }

        .checked .location-name { color: #888; text-decoration: line-through; }
        .checked .location-desc { color: #888; }
        
        .map-container {
            width: 100%; height: 300px; border-radius: 12px; overflow: hidden;
            border: 2px solid var(--card-bg); box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-top: 10px;
        }
        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 頂部標題與控制列 -->
        <div class="top-bar">
            <h1>📍 沖繩實戰打卡清單</h1>
            <div class="top-actions">
                <button class="icon-btn" onclick="toggleDarkMode()" id="themeBtn" title="切換深淺色">🌙</button>
            </div>
        </div>

        <!-- 路線規劃按鈕 -->
        <button class="route-btn" onclick="generateRoute()">🚗 導航：串聯「未打勾」地點</button>

        <!-- 獵人包套作戰區 -->
        <div class="category-card" style="border: 2px solid var(--hunter-color);">
            <h2 class="category-title" style="color: var(--hunter-color);" onclick="toggleCategory('hunter')">
                <span>🎯 獵人包套作戰 (7-11)</span>
                <span class="toggle-icon" id="icon_hunter">▼</span>
            </h2>
            <div class="category-content" id="content_hunter">
                <div class="custom-input-group">
                    <input type="text" id="hunterInput" class="custom-input" placeholder="貼上 7-11 店名">
                    <button class="add-btn btn-hunter" onclick="addHunterStore()">加入</button>
                </div>
                <div id="hunterStoreList" style="margin-top: 10px;"></div>
            </div>
        </div>

        <!-- 購物與美食自訂清單 -->
        <div class="category-card" style="border: 2px solid var(--accent-color);">
            <h2 class="category-title" style="color: var(--accent-color);" onclick="toggleCategory('shopping')">
                <span>🛍️ 代購與美食清單</span>
                <span class="toggle-icon" id="icon_shopping">▼</span>
            </h2>
            <div class="category-content" id="content_shopping">
                <div class="custom-input-group">
                    <input type="text" id="shoppingInput" class="custom-input" placeholder="新增景點、餐廳或商場">
                    <button class="add-btn btn-shopping" onclick="addShoppingStore()">加入</button>
                </div>
                <div id="shoppingStoreList" style="margin-top: 10px;"></div>
            </div>
        </div>

        <!-- 地圖預覽區 -->
        <div class="category-card" id="mapSection">
            <h2 class="category-title" onclick="toggleCategory('map')">
                <span>🗺️ 實戰地圖預覽</span>
                <span class="toggle-icon" id="icon_map">▼</span>
            </h2>
            <div class="category-content" id="content_map">
                <div class="map-container">
                    <iframe id="mapFrame" src="https://maps.google.com/maps?q=那霸市&t=&z=12&ie=UTF8&iwloc=&output=embed" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ---------------- 1. 系統初始化 ----------------
        
        // PWA 支援：動態生成 manifest 讓 iOS/Android 可安裝為完美 App
        const manifestData = {
            name: "沖繩實戰打卡",
            short_name: "沖繩代購",
            display: "standalone",
            background_color: "#f4f7f6",
            theme_color: "#2c3e50",
            icons: [{
                src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='80'%3E📍%3C/text%3E%3C/svg%3E",
                sizes: "192x192",
                type: "image/svg+xml"
            }]
        };
        const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/manifest+json' });
        document.getElementById('manifest-link').href = URL.createObjectURL(blob);

        // 深色模式初始化
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
            document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
        }
        if (localStorage.getItem('darkMode') === 'true') toggleDarkMode();

        // ---------------- 2. 資料庫與介面渲染 ----------------
        let hunterStoresRaw = JSON.parse(localStorage.getItem('hunterStores')) || [];
        let hunterStores = hunterStoresRaw.map(item => typeof item === 'string' ? { name: item, memo: '' } : item);

        let shoppingStores = JSON.parse(localStorage.getItem('shoppingStores'));
        if (!shoppingStores) {
            shoppingStores = [
                { id: 'donki_k', name: '唐吉訶德 國際通店', tag: '掃貨', desc: '熱門零食、藥妝' },
                { id: 'calbee', name: 'Calbee+ 國際通店', tag: '伴手禮', desc: '限定薯條餅乾' },
                { id: 'pokemon', name: '寶可夢中心沖繩', tag: '必逛', desc: '來客夢 AEON 內' },
                { id: 'jojoen', name: '敘敘苑 PARCO CITY店', tag: '美食', desc: '無敵海景和牛燒肉' }
            ];
            localStorage.setItem('shoppingStores', JSON.stringify(shoppingStores));
        }

        function renderAll() {
            const hunterContainer = document.getElementById('hunterStoreList');
            hunterContainer.innerHTML = hunterStores.map((item, index) => 
                createItemHtml('hunter_'+index, item.name, '獵人包套', item.memo, 'hunter', index)
            ).join('');

            const shoppingContainer = document.getElementById('shoppingStoreList');
            shoppingContainer.innerHTML = shoppingStores.map((item, index) => 
                createItemHtml(item.id, item.name, item.tag, item.desc, 'shopping', index)
            ).join('');
        }

        // HTML 加上了 draggable 屬性與拖曳事件
        function createItemHtml(id, name, tag, desc, listType, index) {
            const isChecked = localStorage.getItem(id) === 'true';
            const checkedClass = isChecked ? 'checked' : '';
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' 沖繩')}`;
            const descStyleClass = desc ? 'location-desc' : 'location-desc empty';
            const descHtml = desc ? `<div class="${descStyleClass}">📝 ${desc}</div>` : '';
            
            return `
                <div class="location-item ${checkedClass}" data-name="${name}" 
                     draggable="true" ondragstart="dragStart(event, ${index}, '${listType}')" 
                     ondragover="dragOver(event)" ondrop="drop(event, ${index}, '${listType}')">
                    <div class="drag-handle">☰</div>
                    <div class="left-content" onclick="toggleCheck('${id}', event)">
                        <div class="checkbox-container">
                            <input type="checkbox" id="cb_${id}" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck('${id}', event)">
                        </div>
                        <div class="content-container">
                            <div class="location-name">${name}<span class="tag">${tag}</span></div>
                            ${descHtml}
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="edit-btn" onclick="editMemo('${listType}', ${index}, event)" title="編輯備註">✏️</button>
                        <button class="view-btn" onclick="previewMap('${name}', event)">預覽</button>
                        <a href="${mapUrl}" target="_blank" class="nav-link">導航</a>
                        <button class="delete-btn" onclick="deleteItem('${listType}', ${index}, event)">×</button>
                    </div>
                </div>
            `;
        }

        // ---------------- 3. 拖曳排序邏輯 (Drag & Drop) ----------------
        let dragSrcIndex = null;
        let dragListType = null;

        window.dragStart = function(e, index, listType) {
            dragSrcIndex = index;
            dragListType = listType;
            e.dataTransfer.effectAllowed = 'move';
            setTimeout(() => e.target.classList.add('dragging'), 0); // 延遲添加，讓拖曳圖示保持正常
        };

        window.dragOver = function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        };

        window.drop = function(e, targetIndex, listType) {
            e.preventDefault();
            document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
            
            if (dragListType !== listType || dragSrcIndex === targetIndex) return; // 只能在同分類內排序

            let list = listType === 'hunter' ? hunterStores : shoppingStores;
            const movedItem = list.splice(dragSrcIndex, 1)[0];
            list.splice(targetIndex, 0, movedItem);

            localStorage.setItem(listType === 'hunter' ? 'hunterStores' : 'shoppingStores', JSON.stringify(list));
            renderAll();
        };

        document.addEventListener('dragend', () => {
             document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
        });

        // ---------------- 4. 功能與事件控制 ----------------
        window.toggleCheck = function(id, event) {
            if (event && (event.target.tagName === 'BUTTON' || event.target.tagName === 'A')) return;
            const cb = document.getElementById('cb_' + id);
            if (event && event.target.type !== 'checkbox') cb.checked = !cb.checked;
            localStorage.setItem(id, cb.checked);
            renderAll();
        };

        window.editMemo = function(listType, index, event) {
            event.stopPropagation();
            let list = listType === 'hunter' ? hunterStores : shoppingStores;
            let currentMemo = listType === 'hunter' ? (list[index].memo || '') : (list[index].desc || '');
            let newMemo = prompt(`輸入「${list[index].name}」的備註：`, currentMemo);
            if (newMemo !== null) {
                if (listType === 'hunter') list[index].memo = newMemo.trim();
                else list[index].desc = newMemo.trim();
                localStorage.setItem(listType === 'hunter' ? 'hunterStores' : 'shoppingStores', JSON.stringify(list));
                renderAll();
            }
        };

        window.addHunterStore = function() {
            const val = document.getElementById('hunterInput').value.trim();
            if (val) {
                hunterStores.push({ name: val, memo: '' });
                localStorage.setItem('hunterStores', JSON.stringify(hunterStores));
                document.getElementById('hunterInput').value = '';
                renderAll();
            }
        };

        window.addShoppingStore = function() {
            const val = document.getElementById('shoppingInput').value.trim();
            if (val) {
                shoppingStores.push({ id: 'shop_' + Date.now(), name: val, tag: '自訂', desc: '' });
                localStorage.setItem('shoppingStores', JSON.stringify(shoppingStores));
                document.getElementById('shoppingInput').value = '';
                renderAll();
            }
        };

        window.deleteItem = function(listType, index, event) {
            event.stopPropagation();
            let list = listType === 'hunter' ? hunterStores : shoppingStores;
            const id = listType === 'hunter' ? 'hunter_'+index : list[index].id;
            localStorage.removeItem(id);
            list.splice(index, 1);
            localStorage.setItem(listType === 'hunter' ? 'hunterStores' : 'shoppingStores', JSON.stringify(list));
            renderAll();
        };

        window.toggleCategory = function(id) {
            const content = document.getElementById('content_' + id);
            const icon = document.getElementById('icon_' + id);
            content.classList.toggle('hidden');
            icon.innerText = content.classList.contains('hidden') ? '◀' : '▼';
            localStorage.setItem('toggle_' + id, content.classList.contains('hidden') ? 'closed' : 'open');
        };

        window.previewMap = function(name, event) {
            event.stopPropagation();
            document.getElementById('content_map').classList.remove('hidden');
            document.getElementById('icon_map').innerText = '▼';
            document.getElementById('mapFrame').src = `https://maps.google.com/maps?q=${encodeURIComponent(name + ' 沖繩')}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            document.getElementById('mapSection').scrollIntoView({ behavior: 'smooth' });
        };

        window.generateRoute = function() {
            const unchecked = Array.from(document.querySelectorAll('.location-item:not(.checked)'))
                                   .map(el => el.getAttribute('data-name'))
                                   .filter(n => n && !n.includes('退稅'))
                                   .map(n => encodeURIComponent(n + ' 沖繩'));
            if (unchecked.length === 0) return alert('太棒了！所有任務已完成！');
            if (unchecked.length > 9) { alert('未完成地點較多，為您導航前 9 個。'); unchecked.splice(9); }
            window.open(`https://www.google.com/maps/dir/${unchecked.join('/')}`, '_blank');
        };

        // 載入執行
        document.addEventListener('DOMContentLoaded', () => {
            renderAll();
            ['hunter', 'shopping', 'map'].forEach(id => {
                if (localStorage.getItem('toggle_' + id) === 'closed') toggleCategory(id);
            });
        });
    </script>
</body>
</html>
