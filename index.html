<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- iPhone 桌面捷徑全螢幕體驗專用標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="沖繩代購">
    <title>沖繩實戰打卡清單</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-color: #333;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --hunter-color: #27ae60;
            --route-color: #f39c12;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px 10px 80px 10px; 
            color: var(--text-color); 
            -webkit-tap-highlight-color: transparent;
        }
        h1 { text-align: center; color: var(--primary-color); font-size: 1.4rem; margin-bottom: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .category-card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }
        .category-title { 
            color: var(--primary-color); 
            border-bottom: 2px solid #f0f0f0; 
            padding-bottom: 8px; 
            margin-top: 0; 
            font-size: 1.1rem;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .location-item { 
            display: flex; align-items: center; justify-content: space-between;
            margin: 12px 0; padding-bottom: 12px;
            border-bottom: 1px dashed #eee;
        }
        .location-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
        .left-content { display: flex; align-items: center; flex: 1; }
        .checkbox-container { margin-right: 10px; display: flex; align-items: center; }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: var(--accent-color); }
        .content-container { flex: 1; cursor: pointer; }
        .location-name { font-weight: bold; font-size: 0.95rem; color: var(--primary-color); line-height: 1.4;}
        .tag { background: #ecf0f1; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; color: #7f8c8d; margin-left: 5px; white-space: nowrap; }
        .location-desc { font-size: 0.75rem; color: #888; margin-top: 4px; }
        
        .btn-group { display: flex; gap: 5px; align-items: center; }
        .nav-link { 
            background-color: #4285F4; color: white; text-decoration: none; 
            padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; white-space: nowrap;
        }
        .view-btn {
            background-color: #95a5a6; color: white; border: none;
            padding: 6px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; white-space: nowrap;
        }
        .delete-btn { background: none; border: none; color: #e74c3c; font-size: 1.2rem; cursor: pointer; padding: 0 5px; }
        
        .custom-input-group { display: flex; gap: 8px; margin-top: 10px; }
        .custom-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
        .add-btn { color: white; border: none; padding: 10px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; white-space: nowrap;}
        
        /* 兩組不同顏色的加入按鈕 */
        .btn-hunter { background-color: var(--hunter-color); }
        .btn-shopping { background-color: var(--accent-color); }

        .route-btn {
            display: block; width: 100%; background-color: var(--route-color); color: white;
            border: none; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1rem;
            cursor: pointer; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(243, 156, 18, 0.3);
        }

        .checked .location-name { color: #bdc3c7; text-decoration: line-through; }
        .checked .location-desc { color: #bdc3c7; }
        
        /* 地圖區域 */
        .map-container {
            width: 100%; height: 300px; border-radius: 12px; overflow: hidden;
            border: 2px solid var(--card-bg); box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-top: 10px;
        }
        iframe { width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 沖繩實戰打卡清單</h1>

        <!-- 路線規劃神按鈕 -->
        <button class="route-btn" onclick="generateRoute()">🚗 導航：串聯「未打勾」地點</button>

        <!-- 獵人一番賞包套作戰區 -->
        <div class="category-card" style="border: 2px solid var(--hunter-color);">
            <h2 class="category-title" style="color: var(--hunter-color);">🎯 獵人包套作戰 (7-11)</h2>
            <div class="custom-input-group">
                <input type="text" id="hunterInput" class="custom-input" placeholder="貼上 7-11 店名">
                <button class="add-btn btn-hunter" onclick="addHunterStore()">加入</button>
            </div>
            <div id="hunterStoreList" style="margin-top: 10px;"></div>
        </div>

        <!-- 購物與美食自訂清單 -->
        <div class="category-card" style="border: 2px solid var(--accent-color);">
            <h2 class="category-title" style="color: var(--accent-color);">🛍️ 代購與美食清單</h2>
            <div class="custom-input-group">
                <input type="text" id="shoppingInput" class="custom-input" placeholder="新增景點、餐廳或商場">
                <button class="add-btn btn-shopping" onclick="addShoppingStore()">加入</button>
            </div>
            <div id="shoppingStoreList" style="margin-top: 10px;"></div>
        </div>

        <!-- 地圖預覽區 -->
        <div class="category-card" id="mapSection">
            <h2 class="category-title">🗺️ 實戰地圖預覽</h2>
            <div class="map-container">
                <iframe id="mapFrame"
                    src="https://maps.google.com/maps?q=那霸市&t=&z=12&ie=UTF8&iwloc=&output=embed" 
                    allowfullscreen="" loading="lazy">
                </iframe>
            </div>
            <p style="font-size: 0.75rem; color: #888; margin-top: 8px; text-align: center;">點擊列表的「預覽」可在上方切換地圖位置。</p>
        </div>
    </div>

    <script>
        // 1. 初始化獵人清單
        let hunterStores = JSON.parse(localStorage.getItem('hunterStores')) || [];

        // 2. 初始化購物與美食清單（如果第一次開啟，就載入預設值）
        let shoppingStores = JSON.parse(localStorage.getItem('shoppingStores'));
        
        if (!shoppingStores) {
            shoppingStores = [
                { id: 'donki_k', name: '唐吉訶德 那霸國際通店', tag: '掃貨', desc: '熱門零食、藥妝' },
                { id: 'donki_t', name: '唐吉訶德 那霸壺川店', tag: '掃貨', desc: '寬敞好買避開人潮' },
                { id: 'calbee', name: 'Calbee+ 國際通店', tag: '伴手禮', desc: '限定薯條餅乾' },
                { id: 'yukisio', name: '雪鹽商店', tag: '伴手禮', desc: '雪塩餅乾、冰淇淋' },
                { id: 'brown_sugar', name: '國際通手工黑糖拿鐵', tag: '飲品', desc: '逛街解渴' },
                { id: '711_taxfree', name: '7-11 退稅採購', tag: '注意', desc: '⚠️鮮奶茶須分開含稅結帳' },
                { id: 'pokemon', name: '寶可夢中心沖繩', tag: '必逛', desc: '來客夢 AEON 內' },
                { id: 'gacha_mori', name: 'ガチャガチャの森', tag: '扭蛋', desc: '超大型扭蛋森林' },
                { id: 'otonamo', name: 'オトナモ (Otonamo)', tag: '扭蛋', desc: '大人向高級扭蛋' },
                { id: 'surugaya', name: '駿河屋 (俊合屋)', tag: '玩具', desc: '二手模型、動漫尋寶' },
                { id: 'aeon', name: '永旺夢樂城來客夢', tag: '商場', desc: '玩具反斗城、三麗鷗' },
                { id: 'iias', name: 'iias 沖繩豐崎', tag: '商場', desc: '南部商場、水族館' },
                { id: 'parco', name: '浦添 PARCO CITY', tag: '商場', desc: 'Hobby Zone' },
                { id: 'jacks', name: '傑克牛排', tag: '美食', desc: '老字號烤里肌牛排' },
                { id: 'jojoen', name: '敘敘苑 PARCO CITY店', tag: '美食', desc: '無敵海景和牛燒肉' },
                { id: 'american', name: '美國村', tag: '景點', desc: '週六 20:00 煙火' },
                { id: 'taco_rice', name: 'Taco Rice Cafe Kijimuna', tag: '美食', desc: '歐姆蛋塔可飯' },
                { id: 'el_paso', name: 'EL PASO', tag: '美食', desc: '北谷墨西哥餐廳塔可' },
                { id: 'airport', name: '那霸機場 國內線', tag: '伴手禮', desc: '二樓甜點代購收尾' }
            ];
            localStorage.setItem('shoppingStores', JSON.stringify(shoppingStores));
        }

        // 核心渲染邏輯
        function renderAll() {
            const hunterContainer = document.getElementById('hunterStoreList');
            hunterContainer.innerHTML = hunterStores.map((name, index) => 
                createItemHtml('hunter_'+index, name, '獵人包套', '', 'hunter', index)
            ).join('');

            const shoppingContainer = document.getElementById('shoppingStoreList');
            shoppingContainer.innerHTML = shoppingStores.map((item, index) => 
                createItemHtml(item.id, item.name, item.tag, item.desc, 'shopping', index)
            ).join('');
        }

        // 產生單一地點的 HTML
        function createItemHtml(id, name, tag, desc, listType, index) {
            const isChecked = localStorage.getItem(id) === 'true';
            const checkedClass = isChecked ? 'checked' : '';
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name + ' 沖繩')}`;
            const descHtml = desc ? `<div class="location-desc">${desc}</div>` : '';
            
            // 判斷是哪種刪除動作
            const deleteAction = listType === 'hunter' ? `deleteHunterStore(${index}, event)` : `deleteShoppingStore(${index}, event)`;
            
            return `
                <div class="location-item ${checkedClass}" data-name="${name}">
                    <div class="left-content" onclick="toggleCheck('${id}', event)">
                        <div class="checkbox-container">
                            <input type="checkbox" id="cb_${id}" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck('${id}', event)">
                        </div>
                        <div class="content-container">
                            <div class="location-name">${name}<span class="tag">${tag}</span></div>
                            ${descHtml}
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="view-btn" onclick="previewMap('${name}', event)">預覽</button>
                        <a href="${mapUrl}" target="_blank" class="nav-link">導航</a>
                        <button class="delete-btn" onclick="${deleteAction}">×</button>
                    </div>
                </div>
            `;
        }

        // 打勾與取消
        window.toggleCheck = function(id, event) {
            if (event && (event.target.tagName === 'BUTTON' || event.target.tagName === 'A')) return;
            const cb = document.getElementById('cb_' + id);
            if (event && event.target.type !== 'checkbox') cb.checked = !cb.checked;
            localStorage.setItem(id, cb.checked);
            renderAll();
        };

        // --- 獵人 7-11 專用增刪 ---
        window.addHunterStore = function() {
            const input = document.getElementById('hunterInput');
            const val = input.value.trim();
            if (val) {
                hunterStores.push(val);
                localStorage.setItem('hunterStores', JSON.stringify(hunterStores));
                input.value = '';
                renderAll();
            }
        };

        window.deleteHunterStore = function(index, event) {
            event.stopPropagation();
            localStorage.removeItem('hunter_' + index);
            hunterStores.splice(index, 1);
            localStorage.setItem('hunterStores', JSON.stringify(hunterStores));
            renderAll();
        };

        // --- 購物與美食專用增刪 ---
        window.addShoppingStore = function() {
            const input = document.getElementById('shoppingInput');
            const val = input.value.trim();
            if (val) {
                shoppingStores.push({
                    id: 'shop_' + Date.now(),
                    name: val,
                    tag: '自訂',
                    desc: ''
                });
                localStorage.setItem('shoppingStores', JSON.stringify(shoppingStores));
                input.value = '';
                renderAll();
            }
        };

        window.deleteShoppingStore = function(index, event) {
            event.stopPropagation();
            const item = shoppingStores[index];
            localStorage.removeItem(item.id); // 移除該項目的打勾紀錄
            shoppingStores.splice(index, 1);
            localStorage.setItem('shoppingStores', JSON.stringify(shoppingStores));
            renderAll();
        };

        // 預覽地圖
        window.previewMap = function(name, event) {
            event.stopPropagation();
            const iframe = document.getElementById('mapFrame');
            iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(name + ' 沖繩')}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
            document.getElementById('mapSection').scrollIntoView({ behavior: 'smooth' });
        };

        // 產生路線
        window.generateRoute = function() {
            const uncheckedItems = document.querySelectorAll('.location-item:not(.checked)');
            const locations = [];
            
            uncheckedItems.forEach(item => {
                const name = item.getAttribute('data-name');
                if (name && !name.includes('退稅採購')) { 
                    locations.push(encodeURIComponent(name + ' 沖繩'));
                }
            });

            if (locations.length === 0) {
                alert('太棒了！所有具體任務地點都已完成！');
                return;
            }

            if (locations.length > 9) {
                alert('未完成地點較多，將為您導航前 9 個地點。');
                locations.splice(9);
            }

            const routeUrl = `https://www.google.com/maps/dir/${locations.join('/')}`;
            window.open(routeUrl, '_blank');
        };

        // 初始載入
        document.addEventListener('DOMContentLoaded', renderAll);
    </script>
</body>
</html>
